# ═══════════════════════════════════════════════════════════════════
# Render Blueprint — Docker + Uvicorn + Lifespan
# ═══════════════════════════════════════════════════════════════════

services:
  - type: web
    name: gan-platform
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: oregon                # عدّلها حسب منطقتك: oregon / frankfurt / singapore / ohio
    plan: starter                 # أو free
    branch: main
    autoDeploy: true

    # ─── فحص الصحة ────────────────────────────────────────────
    healthCheckPath: /healthz

    # ─── متغيرات البيئة ───────────────────────────────────────
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"

      - key: PYTHONUNBUFFERED
        value: "1"

      - key: PYTHONIOENCODING
        value: "utf-8"

      # ─── البيئة ────────────────────────────────────────────
      - key: ENVIRONMENT
        value: "production"

      - key: DEBUG
        value: "false"

      # ─── قاعدة البيانات ────────────────────────────────────
      - key: DATABASE_URL
        fromDatabase:
          name: gan-db
          property: connectionString

      # ─── الأسرار ───────────────────────────────────────────
      - key: SECRET_KEY
        generateValue: true

      - key: GEMINI_API_KEY
        sync: false                # تضعه يدوياً من Dashboard

      - key: ADMIN_EMAIL
        value: "admin@example.com" # عدّله

      - key: ADMIN_PASSWORD
        sync: false                # تضعه يدوياً

      # ─── SEO / Metadata ────────────────────────────────────
      - key: SITE_AUTHOR
        value: "جمال المقطري"

      - key: SITE_DESCRIPTION
        value: "هندسة البرمجيات وحلول الذكاء الاصطناعي والأتمتة"

      # ─── السجلات ───────────────────────────────────────────
      # INFO في التطوير (ترى كل الطلبات) / WARNING في الإنتاج
      - key: UVICORN_ACCESS_LEVEL
        value: "INFO"

      # تعطيل الكتابة على الملف على Render (نظام ملفات ephemeral)
      - key: LOG_TO_FILE
        value: "0"


# ═══════════════════════════════════════════════════════════════════
# قاعدة البيانات
# ═══════════════════════════════════════════════════════════════════

databases:
  - name: gan-db
    databaseName: gan_platform
    user: gan_user
    plan: free                    # أو starter
    region: oregon                # نفس منطقة Web Service
    postgresMajorVersion: "16"
