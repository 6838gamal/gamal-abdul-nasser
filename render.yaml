# ═══════════════════════════════════════════════════════════════════
# Render Blueprint — Docker + Uvicorn
# ═══════════════════════════════════════════════════════════════════

services:
  - type: web
    name: gan-platform
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: starter
    branch: main
    autoDeploy: true

    healthCheckPath: /healthz

    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"

      - key: PYTHONUNBUFFERED
        value: "1"

      - key: PYTHONIOENCODING
        value: "utf-8"

      - key: ENVIRONMENT
        value: "production"

      - key: DEBUG
        value: "false"

      - key: DATABASE_URL
        fromDatabase:
          name: gan-db
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: GEMINI_API_KEY
        sync: false

      - key: ADMIN_EMAIL
        value: "admin@example.com"

      - key: ADMIN_PASSWORD
        sync: false

      - key: SITE_AUTHOR
        value: "جمال المقطري"

      - key: SITE_DESCRIPTION
        value: "هندسة البرمجيات وحلول الذكاء الاصطناعي والأتمتة"


databases:
  - name: gan-db
    databaseName: gan_platform
    user: gan_user
    plan: free
    region: oregon
    postgresMajorVersion: "16"
