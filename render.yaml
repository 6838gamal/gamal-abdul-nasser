# ═══════════════════════════════════════════════════════════════════
# Render Blueprint — Infrastructure as Code
# ═══════════════════════════════════════════════════════════════════

services:
  - type: web
    name: gan-platform
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: oregon                # عدّلها حسب منطقتك: oregon / frankfurt / singapore / ohio
    plan: starter                 # أو free
    branch: main
    autoDeploy: true

    # ─── الترحيل: يعمل مرة واحدة قبل بدء Gunicorn ──────────────
    # هذا يمنع 4 workers من تشغيل الترحيل بشكل متزامن
    preDeployCommand: python -m app.cli migrate

    # ─── فحص الصحة ─────────────────────────────────────────────
    healthCheckPath: /healthz

    # ─── متغيرات البيئة ────────────────────────────────────────
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"

      - key: PYTHONUNBUFFERED
        value: "1"

      - key: PYTHONIOENCODING
        value: "utf-8"

      - key: ENVIRONMENT
        value: "production"

      - key: DEBUG
        value: "false"

      - key: DATABASE_URL
        fromDatabase:
          name: gan-db
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: GEMINI_API_KEY
        sync: false                # تضعه يدوياً من Dashboard

      - key: ADMIN_EMAIL
        value: "admin@example.com" # عدّله

      - key: ADMIN_PASSWORD
        sync: false                # تضعه يدوياً

      - key: SITE_AUTHOR
        value: "جمال المقطري"

      - key: SITE_DESCRIPTION
        value: "هندسة البرمجيات وحلول الذكاء الاصطناعي والأتمتة"

    # ─── قرص ثابت (اختياري) ────────────────────────────────────
    # disk:
    #   name: uploads
    #   mountPath: /var/uploads
    #   sizeGB: 1


# ═══════════════════════════════════════════════════════════════════
# قاعدة البيانات
# ═══════════════════════════════════════════════════════════════════

databases:
  - name: gan-db
    databaseName: gan_platform
    user: gan_user
    plan: free                    # أو starter
    region: oregon                # نفس منطقة Web Service
    postgresMajorVersion: "16"
