# ═══════════════════════════════════════════════════════════════════
# Alembic Configuration
# ═══════════════════════════════════════════════════════════════════
#
# ملاحظات:
# - sqlalchemy.url محذوف — يُقرأ من DATABASE_URL في env.py
# - لا تضع كلمة مرور أو host هنا
# ═══════════════════════════════════════════════════════════════════

[alembic]

# مسار ملفات Alembic (env.py, versions/, script.py.mako)
script_location = alembic

# ⚠️ مهم: أضف مسار المشروع لـ sys.path
# حتى يستطيع env.py استيراد app.database.base و app.models
prepend_sys_path = .

# ⚠️ احذف هذا السطر — سنقرأ الـ URL من DATABASE_URL في env.py
# sqlalchemy.url = postgresql+psycopg2://postgres:postgres@db:5432/gan_platform

# ─────────────────────────────────────────────────────────────────
# تنسيق أسماء ملفات migration
# ─────────────────────────────────────────────────────────────────

# استخدام timestamp في اسم الملف (بدل hash عشوائي)
# مثال: 2026_01_01_0000_abc123_add_visitor_lead_message.py
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# ─────────────────────────────────────────────────────────────────
# Timezone
# ─────────────────────────────────────────────────────────────────

# timezone = UTC

# ─────────────────────────────────────────────────────────────────
# truncate_slug_length
# ─────────────────────────────────────────────────────────────────

truncate_slug_length = 40

# ─────────────────────────────────────────────────────────────────
# version_path_separator
# ─────────────────────────────────────────────────────────────────

# version_path_separator = os  # Use os.pathsep. Default is "space"

# ─────────────────────────────────────────────────────────────────
# post-write hooks (اختياري)
# ─────────────────────────────────────────────────────────────────

# hooks = ruff format

# ═══════════════════════════════════════════════════════════════════
# Logging Configuration
# ═══════════════════════════════════════════════════════════════════

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

# ─────────────────────────────────────────────────────────────────
# Root logger
# ─────────────────────────────────────────────────────────────────

[logger_root]
level = WARN
handlers = console
qualname =

# ─────────────────────────────────────────────────────────────────
# SQLAlchemy logger
# ─────────────────────────────────────────────────────────────────

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

# ─────────────────────────────────────────────────────────────────
# Alembic logger
# ─────────────────────────────────────────────────────────────────

[logger_alembic]
level = INFO
handlers =
qualname = alembic

# ─────────────────────────────────────────────────────────────────
# Handlers
# ─────────────────────────────────────────────────────────────────

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

# ─────────────────────────────────────────────────────────────────
# Formatters
# ─────────────────────────────────────────────────────────────────

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
